<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORMA × ContextFit — Find What Fits. Understand What Doesn't.</title>
    <meta
      name="description"
      content="ContextFit embedded in FORMA Seating: constraint-aware furniture shopping decision agent answering Why Not This Product and What Would Make It Work."

      property="og:description"
      content="Evaluate furniture against your real room photo, surface verified product conflicts and unknowns, and adapt recommendations when your priorities change."

      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('contextfit-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white text-[#0E0E0E] dark:bg-[#111111] dark:text-[#F2F2F2] antialiased selection:bg-[#0E0E0E] selection:text-white dark:selection:bg-white dark:selection:text-[#111111]">

    <script type="module" src="/src/main.tsx"></script>
  </body>
